<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <link rel="icon" type="image/svg+xml" href="/jackalope.svg" />
    <title>Morgan Broacha</title>
    <!-- Fonts, in one request, started from the head. They used to load through
         an @import inside the CSS bundle (and a second one inside the Beacon
         hero), so the browser could not ask for a font until it had fetched and
         parsed the stylesheet that named it. Inter and Montserrat are Beacon's
         own faces for its hero; a family's files only download where it is used. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=IBM+Plex+Sans:wght@400;500&family=Inter:wght@400;500&family=Montserrat:wght@500;600&display=swap"
    />
    <!-- Link previews. scripts/route-pages.mjs rewrites these per route at build time. -->
    <meta name="description" content="Product designer in Oakland, California, for software where decisions carry weight: space traffic, health records, academic integrity, systems engineering." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Morgan Broacha" />
    <meta property="og:title" content="Morgan Broacha" />
    <meta property="og:description" content="Product designer in Oakland, California, for software where decisions carry weight: space traffic, health records, academic integrity, systems engineering." />
    <meta property="og:url" content="https://morganbroacha.com/" />
    <meta property="og:image" content="https://morganbroacha.com/og/morgan.jpg" />
    <meta name="twitter:card" content="summary" />
    <script>
      window.addEventListener(
        "error",
        function (event) {
          var target = event.target;
          if (!target || target.tagName !== "SCRIPT" || target.type !== "module") return;
          var root = document.getElementById("root");
          if (!root || root.dataset.appReady) return;
          root.innerHTML =
            "<p style=\"margin:2rem;font-family:system-ui,sans-serif;line-height:1.5\">" +
            "Could not load the site. Try a <strong>hard refresh</strong> " +
            "(Cmd+Shift+R on Mac, Ctrl+Shift+R on Windows).</p>";
        },
        true,
      );
    </script>
  </head>
  <body>
    <noscript>
      <p style="margin: 2rem; font-family: system-ui, sans-serif">
        This portfolio requires JavaScript. Please enable it to continue.
      </p>
    </noscript>
    <div id="root">
      <p style="margin: 2rem; font-family: system-ui, sans-serif; color: #b8b8b8; background: #161616">Loading…</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
